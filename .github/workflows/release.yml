# Publishes PC Hub updates after every push to main. Nothing to do by hand:
#   pchub.VERSION went up            -> release vX.Y.Z with PCHub-update-X.Y.Z.zip (+ PCHub-Setup-X.Y.Z.exe)
#   only a plugin's `version` went up -> release plugin-<id>-<version> with PCHub-plugin-<id>-<version>.zip
# (tools/release_plan.py decides, tools/release_assets.py builds). Every installed PC Hub picks them up by itself.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish updates
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.plan.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: What changed
        id: plan
        run: |
          python tools/release_plan.py > plan.json
          cat plan.json
          echo "app=$(python -c "import json;print(json.load(open('plan.json'))['app'] or '')")" >> "$GITHUB_OUTPUT"
      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tag in $(python -c "import json;p=json.load(open('plan.json'));print(' '.join(([p['app']] if p['app'] else []) + p['plugins']))"); do
            rm -rf "dist/release-$tag"
            python tools/release_assets.py "$tag" "dist/release-$tag"
            gh release create "$tag" dist/release-$tag/*.zip --target "$GITHUB_SHA" \
              --title "$(cat dist/release-$tag/TITLE.txt)" --notes-file "dist/release-$tag/NOTES.md"
          done
          for tag in $(python -c "import json;print(' '.join(json.load(open('plan.json'))['mark']))"); do
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          done

  installer:
    name: Windows installer
    needs: publish
    if: needs.publish.outputs.app != ''
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Build the exe
        run: |
          python tools/make_icon.py
          python tools/write_version_info.py
          python -m PyInstaller --noconfirm --clean build/pchub.spec --distpath dist --workpath build/work
      - name: Build the installer
        shell: pwsh
        run: |
          $version = python -c "import pchub;print(pchub.VERSION)"
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$version" build\installer.iss
      - name: Attach the installer to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.publish.outputs.app }}" (Get-ChildItem dist\installer\*.exe).FullName --clobber
